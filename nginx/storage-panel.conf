# Storage Panel — Nginx server block example.
#
# Copy to /etc/nginx/sites-available/storage-panel, adjust paths/domain,
# symlink into sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace /path/to/storage-panel with the actual install path, and
# /var/www/storage with your configured STORAGE_ROOT. Adjust the PHP-FPM
# socket path for your PHP version.

server {
    listen 80;
    server_name panel.example.com;
    root /path/to/storage-panel;
    index index.php;

    client_max_body_size 6m; # panel uses 5MB chunked uploads by default

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Never serve sensitive directories directly.
    location ^~ /database/  { deny all; return 404; }
    location ^~ /includes/  { deny all; return 404; }
    location ^~ /logs/      { deny all; return 404; }
    location ^~ /storage/   { deny all; return 404; }

    location ~* \.(sqlite|sqlite3|db|log|env|bak|ini)$ {
        deny all;
        return 404;
    }

    # Block dotfiles (.git, .env, .htaccess remnants, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }
}

