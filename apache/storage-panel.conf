# Storage Panel — Apache virtual host example.
#
# Copy to /etc/apache2/sites-available/storage-panel.conf, adjust the
# paths/domain, then:
#   sudo a2ensite storage-panel
#   sudo a2enmod rewrite headers
#   sudo systemctl reload apache2
#
# Replace /path/to/storage-panel with the actual install path, and
# /var/www/storage with your configured STORAGE_ROOT.

<VirtualHost *:80>
    ServerName panel.example.com
    DocumentRoot /path/to/storage-panel

    <Directory /path/to/storage-panel>
        Options -Indexes -FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Never serve the storage root, database, includes, or logs directly.
    <Directory /path/to/storage-panel/database>
        Require all denied
    </Directory>
    <Directory /path/to/storage-panel/includes>
        Require all denied
    </Directory>
    <Directory /path/to/storage-panel/logs>
        Require all denied
    </Directory>
    <Directory /var/www/storage>
        Require all denied
    </Directory>

    # Block sensitive files anywhere under the document root.
    <FilesMatch "\.(sqlite|log|env)$">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/storage-panel-error.log
    CustomLog ${APACHE_LOG_DIR}/storage-panel-access.log combined
</VirtualHost>

# --- Recommended TLS version (after obtaining a certificate, e.g. via Certbot) ---
# <VirtualHost *:443>
#     ServerName panel.example.com
#     DocumentRoot /path/to/storage-panel
#     SSLEngine on
#     SSLCertificateFile /etc/letsencrypt/live/panel.example.com/fullchain.pem
#     SSLCertificateKeyFile /etc/letsencrypt/live/panel.example.com/privkey.pem
#     ... (same <Directory> blocks as above) ...
# </VirtualHost>
